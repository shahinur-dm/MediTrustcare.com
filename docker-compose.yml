version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: meditrust-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: meditrust_erp
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: meditrust-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/meditrust_erp
      JWT_ACCESS_SECRET: meditrust_super_secure_access_secret_key_2026_bd
      JWT_REFRESH_SECRET: meditrust_super_secure_refresh_secret_key_2026_bd
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: meditrust-client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo_data:
